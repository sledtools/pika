</g>
<g class="message" data-from="C" data-to="New" data-label="Welcomes and ordered room logs for C" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="737.0219999999999" y1="486" x2="317.02199999999993" y2="486" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
