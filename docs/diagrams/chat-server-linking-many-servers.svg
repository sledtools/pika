</g>
<g class="note" data-position="over" data-actors="Old,New">
  <polygon points="30,494 444.0659999999998,494 450.0659999999998,500 450.0659999999998,517 30,517" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="444.0659999999998,494 450.0659999999998,500 444.0659999999998,500" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
